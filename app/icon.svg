<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#313244;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1e2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cba6f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#89b4fa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M50 8 L88 22 L88 52 C88 72 70 88 50 94 C30 88 12 72 12 52 L12 22 Z"
        fill="url(#borderGrad)" />

  <!-- Shield inner -->
  <path d="M50 14 L83 26 L83 52 C83 69 67 83 50 89 C33 83 17 69 17 52 L17 26 Z"
        fill="url(#shieldGrad)" />

  <!-- Terminal prompt: "> _" -->
  <text x="27" y="52" font-family="monospace" font-size="22" font-weight="bold" fill="#a6e3a1">&gt;</text>
  <text x="46" y="52" font-family="monospace" font-size="22" font-weight="bold" fill="#cba6f7">_</text>

  <!-- Subtle scanline accent -->
  <line x1="27" y1="62" x2="73" y2="62" stroke="#89b4fa" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>
</svg>
